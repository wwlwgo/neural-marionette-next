<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a35"><title>彩虹能量 · 身体施法实验室</title></head>
<body>
  <main>
    <header><a class="brand" href="/">身体施法实验室<span> / MOTION MAGIC</span></a><span class="local"><i></i> 摄像头在本机处理</span></header>
    <section class="intro"><div class="eyebrow">你的动作，就是魔法。</div><h1>把彩虹握在手里。</h1><p>聚拢蓄力，拉开变大，向上释放。让你的 3D 分身接住月亮。</p></section>
    <section class="workspace">
      <div class="stage-card"><div class="card-top"><span>彩虹能量 · 接住月亮</span><span class="pill" id="state" role="status">准备好了</span></div><div id="stage"></div><div class="spell-banner"><span id="spell-phase">1 / 3</span><strong id="spell-hint">双手在胸前聚拢</strong><div class="power-track"><i id="power"></i></div></div><div class="stage-bottom"><span>拖动旋转视角 · 滚动缩放</span><button id="front" class="text-button">回到正面 ↗</button></div></div>
      <aside>
        <div class="camera-card"><div class="card-top"><span>你的动作</span><span id="fps">未连接</span></div><div class="camera-view"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="camera-empty"><span class="camera-icon">◎</span><strong>让双肩和双手进入画面</strong><p>露出腿部，分身也会跟随腿部动作</p></div></div></div>
        <div class="controls"><button id="start" class="primary">开启摄像头 <span>↗</span></button><button id="demo" class="secondary">先看动作演示</button><p id="message" role="status" aria-live="polite">开启摄像头施法，或先看完整自动演出。</p><div class="steps"><div class="step" data-active="true"><b>01</b> 聚拢 · 蓄力</div><div class="step"><b>02</b> 拉开 · 放大</div><div class="step"><b>03</b> 上推 · 释放</div></div><button id="reset-spell" class="secondary">重新施法 ↺</button><details class="settings"><summary>分身与跟随设置</summary><label class="slider-label" for="character">你的分身</label><select id="character"><option value="guardian">鹿角机甲</option><option value="skeleton">骨骼分身</option></select><p id="model-status">正在加载鹿角机甲…</p><label class="toggle"><span>像照镜子一样跟随</span><input id="mirror" type="checkbox" checked></label><label class="slider-label" for="smooth">动作平滑度 <span id="smooth-value">适中</span></label><input id="smooth" type="range" min="0" max="90" value="50"><button id="center" class="text-button">重新居中</button></details></div>
      </aside>
    </section>
    <footer><span>身体驱动角色</span><span>双手塑造特效</span><span>三个节点串成一次绝招</span><small>单摄像头估计主要身体关节 · 脚部保持地面接触 · 特效在本地实时渲染</small></footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body></html>
